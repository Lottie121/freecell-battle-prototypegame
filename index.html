      stopInfinite();                    // 战斗结束就掐掉无限移动的计时器
      if (pickMode) endPick();           // 退出点选模式
      const box = document.getElementById("win");
      box.textContent = msg || (win ? "🎉 战斗胜利！" : "💀 战斗失败");
      box.classList.toggle("lose", !win);
      box.classList.add("show");
      log(win ? "🏆 战斗胜利" : "💀 战斗失败");
      renderBattle();
      refreshMovable();
    }

    // ===== 生成牌与发牌 =====

    // 一整副牌（4 种花色 × 13 个点数）
    function buildDeck() {
      const deck = [];
      for (const suit of SUITS) {
        for (const rank of RANKS) {
          deck.push({ suit: suit, rank: rank });
        }
      }
      return deck; // 共 52 张
    }

    let nextCardIdCounter = 0;

    // 生成一张牌的 HTML 元素
    function createCardEl(card) {
      const el = document.createElement("div");
      el.className = "card " + card.suit.type;   // 花色 class，决定颜色

      const id = "c" + (nextCardIdCounter++);
      el.dataset.id = id;                        // 唯一编号，撤回时靠它找回这张牌
      cardById[id] = el;

      el.dataset.rank = card.rank;               // 点数，用来判断顺序
      el.dataset.suit = card.suit.type;          // 花色，回收时判断是不是同一个花色
      el.dataset.group = card.suit.group;        // 暖 / 冷分组，搭牌时判断要交替

      // 左上角：只放点数（花色交给中间的大图标，角标不再放小图标）
      const corner = document.createElement("div");
      corner.className = "corner";
      corner.textContent = card.rank;
      el.appendChild(corner);

      // 中央：大号花色图标
      const center = document.createElement("div");
      center.className = "center";
      center.textContent = card.suit.symbol;
      el.appendChild(center);

      // 按住即可拖动（鼠标 / 触屏统一用 pointer 事件）
      el.addEventListener("pointerdown", onPointerDown);
      return el;
    }

    // 生成一张道具牌：夹在牌列里，挖到最上面后点击即可收进背包
    function createItemEl(type) {
      const el = document.createElement("div");
      el.className = "card item";

      const id = "i" + (nextCardIdCounter++);
      el.dataset.id = id;
      el.dataset.item = type.id;                 // 收进背包时按它查出道具类型
      cardById[id] = el;

      const corner = document.createElement("div");
      corner.className = "corner";
      corner.textContent = "道具";
      el.appendChild(corner);

      const center = document.createElement("div");
      center.className = "center";
      center.textContent = type.icon;
      el.appendChild(center);

      el.title = type.name + "：" + type.desc + "（把它挖到最上面后点击收取）";
      el.addEventListener("pointerdown", onPointerDown);
      return el;
    }

    // 按种子发牌：Fisher-Yates 洗牌 + 轮流发到 8 列。
    // 这套算法要和离线验证求解时用的完全一致，牌局才保证可解。
    function buildFromSeed(seed) {
      rngState = seed >>> 0;
      const deck = buildDeck();
      for (let i = deck.length - 1; i > 0; i--) {
        const j = nextInt(i + 1);
        const tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
      }

      const table = document.getElementById("table");
      table.innerHTML = "";                      // 先清空旧的牌列
      const COLUMN_COUNT = 8;
      const columns = [];
      for (let i = 0; i < COLUMN_COUNT; i++) {
        const col = document.createElement("div");
        col.className = "column";
        table.appendChild(col);
        columns.push(col);
      }

      // 轮流发牌：前 4 列各 7 张，后 4 列各 6 张
      deck.forEach(function (card, i) {
        columns[i % COLUMN_COUNT].appendChild(createCardEl(card));
      });

      // 52 张全部发完后，才用同一条随机流抽闪卡：抽牌结果不受影响，牌局依旧保证可解
      Array.prototype.forEach.call(table.querySelectorAll(".card"), function (el) {
        if (nextInt(1000) < CONFIG.foilRate * 1000) {
          el.classList.add("foil");
          el.dataset.foil = "1";               // 回收时触发强化效果
        }
      });

      // 再往牌列里夹道具牌。上面只压 2~3 张牌：
      // 调度槽一共只有 4 个，埋太深就挖不出来了。
      // 只从普通道具池里抽，条件奖励道具（rare）不会出现在牌列里。
      for (let i = 0; i < CONFIG.buriedItems; i++) {
        const col = columns[i % columns.length];
        const type = randomBasicItem();                                   // 从普通道具池里随机埋一件
        const above = 2 + (i % 2);                                        // 压在上面的张数
        const at = Math.max(0, col.children.length - 1 - above);
        col.insertBefore(createItemEl(type), col.children[at] || null);
      }
    }

    // ===== 顶部 4 个回收区：每种花色各一个 =====
    function buildFoundations() {
      const box = document.getElementById("foundations");
      box.innerHTML = "";                        // 清空重建

      SUITS.forEach(function (suit) {
        const wrap = document.createElement("div");
        wrap.className = "foundation-wrap";

        const f = document.createElement("div");
        f.className = "foundation " + suit.type;  // 花色 class，决定配色
        f.dataset.suit = suit.type;               // 这个回收区只收哪种花色
        f.dataset.group = suit.group;             // 暖 / 冷分组，自动回收时判断“对组”
        f.dataset.top = "";                       // 已回收到的最大点数，空表示还没收
        f.dataset.label = suit.symbol + "回收区";  // 空区的文字提示（CSS 读取）
        f.title = "按 A→2→…→K 的顺序回收" + suit.symbol + "牌";

        const rankLabel = document.createElement("div");
        rankLabel.className = "foundation-rank";
        rankLabel.textContent = "最大：—";

        wrap.appendChild(f);
        wrap.appendChild(rankLabel);
        box.appendChild(wrap);
      });
    }

    // ===== 底部 4 个调度槽（对应标准的 4 个空闲格）=====
    function buildFreeCells() {
      const box = document.getElementById("freecells");
      box.innerHTML = "";                        // 清空重建

      for (let i = 0; i < 4; i++) {
        const cell = document.createElement("div");
        cell.className = "freecell";
        cell.title = "把牌拖到这里可以暂存，一次一张";
        box.appendChild(cell);
      }

      // 临时调度槽：始终占一个位置（保证撤回存档数组长度稳定），
      // 平时隐藏，用道具召唤后出现，清空后自动消失。它不参与整组移动上限计算。
      const temp = document.createElement("div");
      temp.className = "freecell temp hidden";
      temp.title = "临时调度槽：不影响可移动牌数，用完即消失";
      box.appendChild(temp);
    }

    // ===== 拖动 =====
    const dragLayer = document.getElementById("drag-layer");
    let drag = null;        // 当前拖动状态，没在拖动时为 null
    let lastDown = null;    // 用来自己识别“双击”

    // ===== 长按查看卡牌效果 =====
    const LONG_PRESS_MS = 500;      // 按住超过这么久就算“长按”
    let longPressTimer = null;

    // 各花色的回收效果说明（与 applyRecycleEffect 的实际逻辑保持一致）
    const SUIT_EFFECT_TEXT = {
      fire:    "🔥 火牌：回收时对敌人造成【点数】点伤害",
      thunder: "⚡️ 雷牌：回收时造成【点数一半】伤害，并使敌人下次攻击减半",
      water:   "💧 水牌：回收时回复【点数一半】血量，满血或溢出部分转为防御",
      wood:    "🍃 木牌：回收时获得 1 层成长，永久提升之后所有回收效果"
    };

    // 气泡内容 + 定位都基于被长按的那张牌
    function showCardInfo(el, x, y) {
      const tip = document.getElementById("card-tip");
      let title, desc;
      if (el.classList.contains("item")) {
        const t = ITEM_TYPES.find(function (it) { return it.id === el.dataset.item; });
        title = t ? t.icon + " " + t.name : "道具";
        desc = t ? t.desc : "";
      } else {
        const suit = suitByType(el.dataset.suit);
        const rank = rankIndex(el) + 1;                 // A=1 … K=13
        title = (suit ? suit.symbol + " " : "") + cardName(el) + (el.dataset.foil === "1" ? " ✦闪卡" : "");
        desc = (SUIT_EFFECT_TEXT[el.dataset.suit] || "") +
               "<br>点数价值：<b>" + rank + "</b>（回收可得 " + rank + " 金币）" +
               "<br><span style='color:#bbb'>搭牌需点数小 1 且暖冷交替</span>";
      }
      tip.innerHTML = '<div class="ct-title">' + title + '</div><div class="ct-desc">' + desc + '</div>';
      tip.classList.add("show");

      // 默认放在牌的上方；空间不够就放下方，并夹在视口内
      const r = el.getBoundingClientRect();
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let left = Math.min(Math.max(8, r.left), window.innerWidth - tw - 8);
      let top = r.top - th - 10;
      if (top < 8) top = r.bottom + 10;
      tip.style.left = left + "px";
      tip.style.top = top + "px";
    }

    function startLongPress(el, x, y) {
      cancelLongPress();
      longPressTimer = setTimeout(function () {
        longPressTimer = null;
        if (!drag) return;
        drag.longPressed = true;                       // 长按只是查看，松手不算移动
        showCardInfo(el, x, y);
      }, LONG_PRESS_MS);
    }

    function cancelLongPress() {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    }

    function hideCardInfo() {
      document.getElementById("card-tip").classList.remove("show");
    }

    // ===== 拖动时高亮所有可接牌的目标 =====
    function showDropHints() {
      clearDropHints();
      if (!drag) return;
      // 能真正落上去的合法接收方 → 绿色高亮
      drag.targets.forEach(function (t) {
        if (t.kind === "column") {
          const top = t.el.lastElementChild;           // 牌列的“底座”是最上面那张牌
          if (top) top.classList.add("drop-hint");
        } else {
          t.el.classList.add("drop-hint");             // 空调度槽 / 回收区本身高亮
        }
      });

      // 点数正好大 1 且暖冷交替满足、但当下还不能落上去的目标牌 → 橙色弱高亮；
      // 不满足暖冷交替（同组）的目标牌不做任何高亮。
      const head = drag.run[0];
      const wantRank = RANKS[rankIndex(head) + 1];
      if (!wantRank) return;                           // 拖的是 K，没有更大的点数
      document.querySelectorAll(".column").forEach(function (col) {
        if (col === drag.originColumn) return;
        const top = col.lastElementChild;
        if (!top || top.classList.contains("item")) return;   // 空列 / 道具牌不参与
        if (top.classList.contains("drop-hint")) return;      // 已按合法绿色高亮
        if (top.dataset.rank === wantRank && top.dataset.group !== head.dataset.group) {
          top.classList.add("drop-hint-weak");
        }
      });
    }

    function clearDropHints() {
      document.querySelectorAll(".drop-hint, .drop-hint-weak").forEach(function (el) {
        el.classList.remove("drop-hint");
        el.classList.remove("drop-hint-weak");
      });
    }

    // 按住一张牌：可以移动就开始拖动，不能移动则完全没反应
    function onPointerDown(ev) {
      if (ev.button !== 0 && ev.pointerType === "mouse") return;   // 只响应鼠标左键
      const el = ev.currentTarget;

      // 道具牌：不参与拖动，挖到最上面后点击即可收进背包
      if (el.classList.contains("item")) {
        if (el.parentElement && el === el.parentElement.lastElementChild && !battle.over) {
          ev.preventDefault();
          collectItem(el);
        } else {
          showTip("把这张道具牌上方的牌移走，露出来后点击收取");
        }
        return;
      }

      if (!canPickUp(el)) {            // 无法移动的牌不可点击，也不可拖动
        if (el.classList.contains("locked")) showTip("这张牌被污染锁住了");
        return;
      }

      // 自己识别双击：同一张牌 350ms 内按下第二次 → 自动判断去处
      const now = Date.now();
      if (lastDown && lastDown.el === el && now - lastDown.time < 350) {
        lastDown = null;
        ev.preventDefault();
        autoPlace(el);
        return;
      }
      lastDown = { el: el, time: now };

      ev.preventDefault();

      const run = getRun(el);
      const rect = el.getBoundingClientRect();

      drag = {
        run: run,
        snapshot: serialize(),                 // 拖动前先存档，落位成功后才记录进撤回栈
        combatState: captureCombatState(),     // 同步存档战斗数值，撤回时一并还原
        originParent: el.parentElement,
        originNext: run[run.length - 1].nextElementSibling,  // 放不下时插回这个位置之前
        originColumn: el.closest(".column"),
        originCell: el.closest(".freecell"),
        offsetX: ev.clientX - rect.left,       // 手指 / 鼠标在牌面内的位置
        offsetY: ev.clientY - rect.top,
        startX: ev.clientX,                    // 用于判断“有没有真的移动过”
        startY: ev.clientY,
        moved: false,
        longPressed: false,
        snap: null
      };
      drag.targets = validTargets(run, drag.originColumn, drag.originCell);
      showDropHints();                         // 高亮所有能接住这组牌的目标
      startLongPress(el, ev.clientX, ev.clientY);   // 按住不动 500ms 显示效果说明

      // 拖动期间锁住牌桌的最小高度：否则被拿起的列会变矮，
      // 下方的调度槽跟着上移，吸附位置就会跟着跳。
      const table = document.getElementById("table");
      drag.tableMinHeight = table.style.minHeight;
      table.style.minHeight = table.offsetHeight + "px";

      // 把这一组牌搬到拖动层，并让它的左上角停在原来的位置。
      // 先清掉列内联边距：压缩得很紧的列拖出来时，也能按默认间距看清楚
      run.forEach(function (c) { c.style.marginBottom = ""; dragLayer.appendChild(c); });
      dragLayer.classList.add("show");
      dragLayer.style.transform = "translate(" + rect.left + "px," + rect.top + "px)";

      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", onPointerUp);
      window.addEventListener("pointercancel", onPointerCancel);
    }

    function onPointerMove(ev) {
      if (!drag) return;

      // 一旦真的移动过，就取消“长按查看”并收起气泡
      if (!drag.moved &&
          (Math.abs(ev.clientX - drag.startX) + Math.abs(ev.clientY - drag.startY) > 8)) {
        drag.moved = true;
        drag.longPressed = false;
        cancelLongPress();
        hideCardInfo();
      }

      // 整组牌跟着指针走（拖动层独立于缩放舞台，需按 MOBILE_SCALE 缩放并补偿位移）
      const tx = (ev.clientX - drag.offsetX) / MOBILE_SCALE;
      const ty = (ev.clientY - drag.offsetY) / MOBILE_SCALE;
      dragLayer.style.transform =
        "scale(" + MOBILE_SCALE + ") translate(" + tx + "px," + ty + "px)";

      // 自动吸附：找范围内最近的可放置位置并高亮
      const snap = findSnapTarget(drag.targets, ev.clientX, ev.clientY);
      if (snap !== drag.snap) {
        if (drag.snap) drag.snap.el.classList.remove("active-drop");
        drag.snap = snap;
        if (snap) snap.el.classList.add("active-drop");
      }
    }

    function onPointerUp() {
      cancelLongPress();
      hideCardInfo();
      clearDropHints();
      if (!drag) return;
      const d = drag;
      drag = null;
      removeDragListeners();
      if (d.snap) d.snap.el.classList.remove("active-drop");

      let moved = false;
      if (d.snap && !d.longPressed) {    // 长按（只是查看说明）松手不落位
        placeRun(d.run, d.snap);         // 吸附成功 → 落位（appendChild 会自动从拖动层移出来）
        history.push({ snap: d.snapshot, state: d.combatState });   // 记录这步之前的局面，供撤回
        if (d.snap && d.snap.needsForce) consumeForceCharge();  // 只有真正突破上限才消耗充能
        moved = true;
      } else {
        restoreRun(d);                   // 吸附失败 / 长按查看 → 回到原位
      }
      dragLayer.classList.remove("show");
      document.getElementById("table").style.minHeight = d.tableMinHeight || "";
      refreshMovable();
      renderBattle();
      checkWin();                        // 先判定是否已通关，再扣步数
      if (moved) consumeMove();          // 落位消耗 1 步，步数用尽才进下一回合
      autoCollect();
    }

    function onPointerCancel() {
      cancelLongPress();
      hideCardInfo();
      clearDropHints();
      if (!drag) return;
      const d = drag;
      drag = null;
      removeDragListeners();
      if (d.snap) d.snap.el.classList.remove("active-drop");
      restoreRun(d);
      dragLayer.classList.remove("show");
      document.getElementById("table").style.minHeight = d.tableMinHeight || "";
      refreshMovable();
    }

    function removeDragListeners() {
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("pointerup", onPointerUp);
      window.removeEventListener("pointercancel", onPointerCancel);
    }

    // 把这一组牌插回原来的位置
    function restoreRun(d) {
      const anchor = d.originNext;
      d.run.forEach(function (c) {
        if (anchor && anchor.parentElement === d.originParent) {
          d.originParent.insertBefore(c, anchor);
        } else {
          d.originParent.appendChild(c);
        }
      });
    }

    // ===== 双击自动落位：优先回收区，其次调度槽，最后牌列 =====
    function autoPlace(el) {
      const originColumn = el.closest(".column");
      const originCell = el.closest(".freecell");

      // 牌列里只有最上面那一张能操作
      if (originColumn && el !== originColumn.lastElementChild) {
        showTip("只能操作一列最上面那张牌");
        return;
      }

      const targets = validTargets([el], originColumn, originCell);
      if (!targets.length) {
        showTip("这张牌暂时没有可以放置的位置");
        return;
      }

      const order = { foundation: 0, freecell: 1, column: 2 };
      targets.sort(function (a, b) { return order[a.kind] - order[b.kind]; });

      const snapshot = serialize();
      const state = captureCombatState();
      placeRun([el], targets[0]);
      history.push({ snap: snapshot, state: state });
      refreshMovable();
      renderBattle();
      checkWin();                        // 先判定是否已通关，再扣步数
      consumeMove();                     // 落位消耗 1 步
      autoCollect();
    }

    // ===== 通关判定：4 个回收区都收到 K，也就是整副牌都收完，同样算赢 =====
    function checkWin() {
      if (battle.over) return;
      const done = Array.prototype.every.call(
        document.querySelectorAll(".foundation"),
        function (f) { return f.dataset.top === RANKS[RANKS.length - 1]; }
      );
      if (done) endBattle(true, "🎉 全部牌回收完成，战斗胜利！");
    }

    // ===== 新的一局：清空调度槽与回收区，发一局保证可解的牌 =====
    function newGame() {
      history = [];                              // 清空撤回记录
      cardById = {};
      nextCardIdCounter = 0;
      lastDown = null;
      const winBox = document.getElementById("win");
      winBox.classList.remove("show");
      winBox.classList.remove("lose");
      document.getElementById("tip").textContent = "";

      buildFoundations();                        // 回收区全部清空
      buildFreeCells();                          // 调度槽全部清空

      // 从“保证可解”的种子库里随机挑一局
      const seed = SOLVABLE_SEEDS[Math.floor(Math.random() * SOLVABLE_SEEDS.length)];
      buildFromSeed(seed);

      // 重置战斗状态
      battle.playerHp = CONFIG.playerMaxHp;
      battle.enemyHp = CONFIG.enemyMaxHp;
      battle.turn = 1;
      battle.growth = 0;
      battle.freezeTurns = 0;
      battle.paralyze = false;
      battle.bag = [];
      battle.over = false;
      battle.pending = null;
      battle.movesLeft = rollMoves();               // 本回合移动次数
      battle.nextMoves = rollMoves();               // 预告下一回合移动次数
      battle.combo = 0;                             // 连击从零开始
      battle.forceCharge = 1;                       // 大力移动：开局自带 1 个
      battle.forceActive = false;                   // 大力移动启用状态复位
      battle.mana = CONFIG.manaStart;               // 开局魔力
      battle.gold = CONFIG.goldStart;               // 开局金币（留够买道具破局）
      battle.defense = 0;                           // 防御清零
      battle.kRewarded = {};                        // 清空 K 的奖励记录
      battle.growthCards = {};                      // 清空成长领取记录
      battle.runRewardTurn = -1;                    // 「连出顺子」奖励计数复位
      battle.runRewardCount = 0;
      battle.aRewarded = false;                     // 四花色 A 奖励复位
      battle.luckyAnnounced = {};                   // 「收到 8（发）」播报记录复位
      battle.rewards = {};                          // 条件奖励道具的已领记录清零
      battle.usedUndo = false;                      // 「完美主义」要求一次不撤回
      battle.timePause = false;                     // 时间暂停启用状态复位
      battle.movesBonus = 0;                        // 蓄力的下回合加成清零
      battle.cellsUsed = false;                     // 调度槽占用标记复位（防开局白送龙卷风）
      turnStartSnapshot = null;
      if (purifyMode) exitPurifyMode();             // 净化模式复位
      if (pickMode) endPick();                      // 点选模式复位
      stopInfinite();                               // 无限移动计时器复位

      logLines = [];
      document.getElementById("log").innerHTML = "";
      document.getElementById("bag").classList.remove("open");

      battle.pending = choosePollution();         // 开局先预告敌人的第一手污染
      log("⚔️ 战斗开始：把牌回收进上方阵列来攻击污染体");
      if (battle.pending.kind !== "none") log("🔮 敌人预告：" + battle.pending.label);
      log("💪 开局自带 1 个大力移动；魔力 " + battle.mana + " / " + CONFIG.manaMax + "，金币 " + battle.gold);
      log("🍀 某花色收到 8（谐音「发」）后，该花色此后每张回收额外 +" + CONFIG.goldLuckyBonus + " 金币");
      document.getElementById("shop").classList.remove("open");

      refreshMovable();
      captureTurnStart();                         // 记下第 1 回合开始时的局面
      renderBattle();
    }

    // ===== 新手教程：开局分步介绍基础玩法 =====
    const TUTORIAL_STEPS = [
      {
        title: "🎴 目标：回收全部牌，同时打倒污染体",
        body: "<div class='tut-line'>把 <b>52 张牌</b>按花色、从 <b>A 到 K</b> 的顺序全部收进上方阵列，就能获胜；血量被污染体打光则失败。</div>" +
              "<div class='tut-line'>牌桌分三块：上方 <b>8 列牌堆</b>、下方左侧 <b>4 个回收区</b>、下方右侧 <b>4 个调度槽</b>。</div>"
      },
      {
        title: "🧩 搭牌规则：点数小 1 + 暖冷交替",
        body: "<div class='tut-line'>一张牌只能压到 <b>比它大 1 点</b>的牌上，并且要<b>暖冷交替</b>。</div>" +
              "<div class='tut-line'>🔥 火 / ⚡️ 雷 属于<b>暖色组</b>，💧 水 / 🍃 木 属于<b>冷色组</b>。</div>" +
              "<div class='tut-line'>例：水4 可以放到 火5 / 雷5 上面，但不能放到 水5 上。</div>"
      },
      {
        title: "🖐 操作：按住拖动",
        body: "<div class='tut-line'>按住一张能动的牌拖动，靠近目标 <b>70px</b> 内会自动吸附；松手落位。</div>" +
              "<div class='tut-line'>拖动时，所有<b>能接住它的牌会被高亮</b>（绿色描边），看一眼就知道能放哪。</div>" +
              "<div class='tut-line'><b>双击</b>一张牌可自动寻找落点；<b>长按</b>一张牌可查看它的效果说明。</div>"
      },
      {
        title: "⚔️ 回收效果：不同花色不一样",
        body: "<div class='tut-line'>🔥 火：造成【点数】点伤害</div>" +
              "<div class='tut-line'>💧 水：回复【点数一半】血量，满血或溢出转防御</div>" +
              "<div class='tut-line'>⚡️ 雷：造成【点数一半】伤害，敌人下次攻击减半</div>" +
              "<div class='tut-line'>🍃 木：获得 1 层成长，永久增强后续回收效果</div>" +
              "<div class='tut-line'>连续回收还会累积<b>连击倍率</b>，收得越顺伤害越高。</div>"
      },
      {
        title: "🎒 道具与商店",
        body: "<div class='tut-line'>有的道具牌夹在牌列里，<b>挖到最上面后点击</b>即可收进背包。</div>" +
              "<div class='tut-line'>背包里的道具点一下就能用；也能在<b>商店</b>花金币购买或抽道具。</div>" +
              "<div class='tut-line'>回收任意牌都会按点数获得金币，击败污染体还有额外奖励。</div>"
      },
      {
        title: "🛡 战斗：回合、移动次数与污染",
        body: "<div class='tut-line'>每回合有随机次数的移动，<b>用完自动进入下一回合</b>；敌人会提前预告下回合的攻击与污染手段。</div>" +
              "<div class='tut-line'>污染可能是锁牌、换花色、换点数或冻槽，都可恢复，不会产生死局。</div>" +
              "<div class='tut-line'>✨ 作为先手福利，<b>正式开局送 120 秒无限移动</b>（期间落位不消耗次数）。</div>"
      }
    ];

    let tutIndex = 0;
    let pendingOpeningBoost = false;   // 教程关闭后是否补发开局福利

    function renderTutorial() {
      const step = TUTORIAL_STEPS[tutIndex];
      document.getElementById("tut-title").textContent = step.title;
      document.getElementById("tut-body").innerHTML = step.body;
      document.getElementById("tut-step").textContent =
        (tutIndex + 1) + " / " + TUTORIAL_STEPS.length;
      document.getElementById("tut-next").textContent =
        tutIndex === TUTORIAL_STEPS.length - 1 ? "开始游戏" : "下一步";
    }

    function showTutorial(grantAfter) {
      pendingOpeningBoost = !!grantAfter;
      tutIndex = 0;
      renderTutorial();
      document.getElementById("tutorial").classList.add("show");
    }

    function nextTutorial() {
      if (tutIndex < TUTORIAL_STEPS.length - 1) {
        tutIndex++;
        renderTutorial();
      } else {
        closeTutorial();
      }
    }

    function closeTutorial() {
      document.getElementById("tutorial").classList.remove("show");
      if (pendingOpeningBoost) {           // 首次进入：教程结束后发放开局先手福利
        pendingOpeningBoost = false;
        grantOpeningBoost();
      }
    }

    // 正式开局先手福利：120 秒无限移动
    function grantOpeningBoost() {
      if (battle.over) return;
      startInfinite(CONFIG.openingInfiniteSeconds);
      log("⏱ 开局先手：获得 " + CONFIG.openingInfiniteSeconds + " 秒无限移动");
    }

    // 重新开始：重开一局并同样发放开局福利
    function restartGame() {
      newGame();
      grantOpeningBoost();
      scheduleFit();          // 新一局牌桌高度可能变化，重新量一次缩放比
    }

    // 按钮绑定
    document.getElementById("tutorial-btn").addEventListener("click", function () { showTutorial(false); });
    document.getElementById("tut-next").addEventListener("click", nextTutorial);
    document.getElementById("tut-skip").addEventListener("click", closeTutorial);
    document.getElementById("undo").addEventListener("click", undo);
    document.getElementById("restart").addEventListener("click", restartGame);
    document.getElementById("purify").addEventListener("click", enterPurifyMode);
    document.getElementById("force-chip").addEventListener("click", toggleForce);
    document.getElementById("bag-btn").addEventListener("click", function () {
      document.getElementById("bag").classList.toggle("open");
      document.getElementById("shop").classList.remove("open");   // 两个面板同时只开一个
    });
    document.getElementById("shop-btn").addEventListener("click", function () {
      document.getElementById("shop").classList.toggle("open");
      document.getElementById("bag").classList.remove("open");
      renderShop();
    });
    document.getElementById("hp2mana").addEventListener("click", convertHpToMana);
    document.getElementById("extra-move").addEventListener("click", buyExtraMove);
    document.getElementById("rewind").addEventListener("click", rewindTurn);
    document.getElementById("end-turn").addEventListener("click", endTurnManual);

    // ===== 移动端：整块牌桌等比缩放到屏幕内 =====
    // 桌面布局固定 752px 宽，窄屏放不下，这里按 宽/高 双约束算出缩放比，
    // 只缩小不放大（桌面比例保持 1），并同步给拖动层 / 吸附判定使用。
    let fitRaf = null;
    let fitTries = 0;
    function fitStage() {
      const stage = document.getElementById("stage");
      if (!stage) return;
      // offsetHeight / offsetWidth 取的是未缩放的布局尺寸，不受 transform 影响
      const sw = stage.offsetWidth;
      const sh = stage.offsetHeight;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      // 后台加载 / 尚未排版时可能量到 0，直接算会得到 scale(0) 把整页缩没，这里稍后重试
      if (!(vw > 0 && vh > 0 && sw > 0 && sh > 0)) {
        if (fitTries++ < 30) setTimeout(fitStage, 100);
        return;
      }
      fitTries = 0;
      const s = Math.min(1, (vw * 0.98) / sw, (vh * 0.98) / sh);
      if (!isFinite(s) || s <= 0) return;          // 兜底，绝不应用异常缩放
      MOBILE_SCALE = s;
      stage.style.transform = s === 1 ? "" : "scale(" + s + ")";
      // 只有需要缩放时才锁死滚动，保持宽屏原有行为
      document.documentElement.classList.toggle("scaled", s < 1);
    }
    function scheduleFit() {
      if (fitRaf) return;
      fitRaf = requestAnimationFrame(function () { fitRaf = null; fitStage(); });
    }
    window.addEventListener("resize", scheduleFit);
    window.addEventListener("orientationchange", function () { setTimeout(fitStage, 120); });

    // 键盘：Ctrl+Z 撤回
    window.addEventListener("keydown", function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z") {
        ev.preventDefault();
        undo();
      }
    });

    // 出牌区不放牌时，点空白处不做任何事；开局并弹出新手教程
    newGame();
    showTutorial(true);
    fitStage();
    // 牌桌高度会随牌数变化，布局稳定后再量一次
    window.addEventListener("load", fitStage);
  </script>
</body>
